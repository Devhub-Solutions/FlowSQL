name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build & test
        run: mvn -B verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report failures
        if: failure()
        run: |
          grep -E "\[ERROR\]" build.log | head -20 | while IFS= read -r line; do echo "::error::${line}"; done
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -q -E "FAILURE|ERROR" "$f" && echo "::error title=$(basename $f)::$(head -c 1500 $f | tr '\n' ' ')"
          done
          true
