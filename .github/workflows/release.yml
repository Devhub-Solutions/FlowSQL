name: Release to Maven Central

# Chay khi push tag vX.Y.Z (vd: git tag v1.0.0 && git push origin v1.0.0)
# hoac bam "Run workflow" tren tab Actions.
#
# Secrets can co (Settings > Secrets and variables > Actions):
#   CENTRAL_USERNAME   - user token cua central.sonatype.com
#   CENTRAL_PASSWORD   - password token cua central.sonatype.com
#   GPG_PRIVATE_KEY    - private key ASCII-armored (gpg --armor --export-secret-keys <KEY_ID>)
#   GPG_PASSPHRASE     - passphrase cua key
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      auto_publish:
        description: 'Tu dong publish sau khi validate (false = vao central.sonatype.com bam Publish)'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Use Maven 3.9.9
        run: |
          echo "::warning title=runner-maven::$(mvn -v | head -1)"
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz | tar xz -C "$HOME"
          echo "$HOME/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Check tag matches pom version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          POM_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME khong khop pom version $POM_VERSION"; exit 1
          fi

      - name: Skip if version already on Maven Central
        id: exists
        run: |
          V=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/vn/io/devhub/flowsql/$V/flowsql-$V.pom")
          if [ "$CODE" = "200" ]; then
            echo "::notice::flowsql $V da co tren Maven Central, bo qua buoc upload"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish public key to keyservers
        run: |
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          gpg --keyserver hkps://keys.openpgp.org --send-keys "$KEY_ID" || true
          gpg --keyserver hkps://keyserver.ubuntu.com --send-keys "$KEY_ID" || true

      - name: Deploy to Maven Central
        if: steps.exists.outputs.skip != 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -P release deploy -Dcentral.autoPublish=${{ inputs.auto_publish == true }} 2>&1 | tee deploy.log
          exit ${PIPESTATUS[0]}

      - name: Report deploy errors
        if: failure()
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          DEP=$(grep -oE "Deployment [0-9a-f-]{36}" deploy.log | tail -1 | awk '{print $2}')
          Z=$(find target -name '*.zip' -path '*central*' | head -1)
          [ -n "$Z" ] && echo "::error title=bundle::$(unzip -Z1 "$Z" | tr '\n' ' ')"
          if [ -n "$DEP" ]; then
            TOKEN=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
            curl -s -X POST -H "Authorization: Bearer $TOKEN" "https://central.sonatype.com/api/v1/publisher/status?id=$DEP" > status.json
            echo "::error title=state::$(jq -r .deploymentState status.json)"
            jq -r '.errors // {} | to_entries[] | .key + " => " + (.value|join(" ; "))' status.json | head -8 | while IFS= read -r l; do echo "::error title=central::${l:0:1500}"; done
          else
            grep "\[ERROR\]" deploy.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          fi
          true

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/flowsql-*.jar
